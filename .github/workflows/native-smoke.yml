name: Native smoke test

# Manually triggered while CI support is blocked: on windows-latest the
# WebView2 DevTools port never opens (see BUILD_PROGRESS.md, A-4). The same
# script passes locally on Windows 11.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native-smoke-windows:
    name: Native smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      - name: Ensure WebView2 runtime is installed
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
          if (-not $version) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            Start-Process $installer -ArgumentList '/silent', '/install' -Wait
            $version = (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
          }
          if (-not $version) { throw 'WebView2 runtime is not available' }
          "WebView2 runtime $version"
      - name: Build application (debug, embedded frontend)
        run: pnpm --filter @rustgit/desktop tauri build --debug --no-bundle
      - name: Launch and drive the native application
        working-directory: apps/desktop
        env:
          RUSTGIT_SMOKE_KEEP_APP_ON_FAILURE: "1"
        run: node tests/native/windows-smoke.mjs ../../target/debug/rustgit.exe smoke-screenshots
      - name: Diagnose WebView2 on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv
          Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe' OR Name = 'rustgit.exe'" | Select-Object ProcessId, Name, CommandLine | Format-List
          Get-NetTCPConnection -State Listen | Where-Object LocalPort -ge 9000 | Format-Table LocalAddress, LocalPort, OwningProcess
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-smoke-screenshots
          path: apps/desktop/smoke-screenshots
          if-no-files-found: ignore
