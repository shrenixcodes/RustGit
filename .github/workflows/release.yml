name: Release

# workflow_dispatch: builds and verifies installers as workflow artifacts only.
# Tag push (v*): additionally creates a DRAFT GitHub release with the verified
# installers and SHA256SUMS.txt. Publishing the draft is a manual decision.
# Installers are not code-signed or notarized (no signing credentials exist).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Build installers
        run: pnpm --filter @rustgit/desktop tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect and verify installers
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="target/${{ matrix.target }}/release/bundle"
          mkdir -p dist-installers
          find "$bundle_dir" -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) \
            -exec cp {} dist-installers/ \;
          count=$(find dist-installers -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No installers were produced" >&2
            exit 1
          fi
          for file in dist-installers/*; do
            size=$(wc -c < "$file")
            if [ "$size" -lt 1000000 ]; then
              echo "$file is suspiciously small ($size bytes)" >&2
              exit 1
            fi
            echo "$file: $size bytes"
            if command -v file > /dev/null; then file "$file"; fi
          done
      - name: Check Linux artifact architecture
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          dpkg-deb --info dist-installers/*.deb | grep -E '^ (Package|Version|Architecture):'
          dpkg-deb --info dist-installers/*.deb | grep -q 'Architecture: amd64'
      - name: Check macOS binary architecture
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/rustgit"
          lipo -archs "$binary"
          case "${{ matrix.target }}" in
            aarch64-*) lipo -archs "$binary" | grep -qx arm64 ;;
            x86_64-*) lipo -archs "$binary" | grep -qx x86_64 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          path: dist-installers/*
          if-no-files-found: error

  draft-release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true
      - name: Checksums
        working-directory: installers
        run: sha256sum * | tee SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "Draft created by the release workflow for ${TAG}. Review before publishing."
            echo
            echo "Installers are NOT code-signed or notarized. Windows SmartScreen and macOS Gatekeeper will warn."
            echo
            echo "SHA-256 checksums:"
            echo '```'
            cat installers/SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "RustGit ${TAG}" \
            --notes-file notes.md
